<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny — The 21st Century AI | by Wondermayank</title>
<meta name="description" content="Tiny is Wondermayank's Groq-powered AI persona — ask about his projects, ThunderStudy, or anything else. Fast answers, 10 free messages a day.">
<meta property="og:title" content="Tiny — The 21st Century AI">
<meta property="og:description" content="Wondermayank's Groq-powered AI chat persona.">
<meta property="og:type" content="website">
<style>
  :root[data-theme="light"], :root {
    --primary: #573AFC;
    --primary-active: #4527E0;
    --primary-focus: #6B4FFF;
    --ink: #1d1d1f;
    --body: #3c3c3c;
    --muted: #6b6b6b;
    --muted-soft: #9a9a9a;
    --hairline: #e6e6e6;
    --hairline-strong: #cccccc;
    --canvas: #ffffff;
    --canvas-parchment: #f5f5f7;
    --surface-soft: #f7f7f7;
    --surface-card: #fafafa;
    --bubble-bot: #f0eefe;
    --bubble-user: #573AFC;
    --on-primary: #ffffff;
    --error: #dc2626;
  }
  :root[data-theme="dark"] {
    --primary: #9A7AFB;
    --primary-active: #8663f0;
    --primary-focus: #b09bff;
    --ink: #f5f5f7;
    --body: #d1d1d6;
    --muted: #8e8e93;
    --muted-soft: #636366;
    --hairline: #2c2c2e;
    --hairline-strong: #3a3a3c;
    --canvas: #0e0e10;
    --canvas-parchment: #161618;
    --surface-soft: #1a1a1c;
    --surface-card: #1c1c1e;
    --bubble-bot: #201c33;
    --bubble-user: #9A7AFB;
    --on-primary: #0e0e10;
    --error: #f47272;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: var(--canvas);
    color: var(--ink);
  }

  #loader {
    position: fixed; inset: 0; z-index: 999;
    background: var(--canvas);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .4s ease;
  }
  #loader svg circle {
    fill: none; stroke: var(--primary); stroke-width: 3;
    stroke-linecap: round; stroke-dasharray: 140;
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin { to { stroke-dashoffset: -280; } }
  #loader.hide { opacity: 0; pointer-events: none; }

  .app {
    height: 100dvh;
    display: grid;
    grid-template-columns: 380px 1fr;
  }

  /* ---- Left: character panel ---- */
  .stage {
    position: relative;
    background: linear-gradient(180deg, var(--canvas-parchment) 0%, var(--surface-soft) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    border-right: 1px solid var(--hairline);
    overflow: hidden;
    padding: 28px 20px 0;
  }
  .stage-header {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 20px 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9999px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    color: var(--on-primary); font-weight: 700; font-size: 16px;
    flex-shrink: 0;
  }
  .brand-text h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.1px; }
  .brand-text p {
    margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--primary);
  }
  .theme-toggle {
    width: 38px; height: 38px; border-radius: 9999px;
    border: 1px solid var(--hairline-strong); background: var(--canvas);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink); flex-shrink: 0;
  }
  .theme-toggle svg { width: 18px; height: 18px; }

  .character-wrap {
    position: relative;
    width: 100%;
    max-width: 300px;
    aspect-ratio: 3 / 4;
    filter: drop-shadow(3px 5px 30px rgba(0,0,0,0.22));
  }
  .character-wrap img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: contain; object-position: bottom;
    opacity: 0; transition: opacity .35s ease;
  }
  .character-wrap img.active { opacity: 1; }

  .stage-caption {
    text-align: center;
    padding: 14px 8px 24px;
    max-width: 300px;
  }
  .stage-caption .status {
    font-size: 13px; font-weight: 600; color: var(--primary);
    letter-spacing: 0.2px;
  }
  .stage-caption .bio {
    margin: 6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5;
  }

  /* ---- Right: chat ---- */
  .chat-col { display: flex; flex-direction: column; min-width: 0; }
  .chat-header {
    display: none;
    align-items: center; gap: 10px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--hairline);
  }
  .messages {
    flex: 1; overflow-y: auto;
    padding: 28px 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .row { display: flex; }
  .row.bot { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 68%;
    padding: 12px 16px;
    font-size: 15px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .row.bot .bubble {
    background: var(--bubble-bot);
    color: var(--ink);
    border-radius: 4px 18px 18px 18px;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: var(--on-primary);
    border-radius: 18px 4px 18px 18px;
  }
  .row.bot .bubble.typing { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
  .dot { width: 6px; height: 6px; border-radius: 9999px; background: var(--muted-soft); animation: bounce 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .composer {
    border-top: 1px solid var(--hairline);
    padding: 14px 20px 20px;
    background: var(--canvas);
  }
  .limit-note {
    font-size: 12px; color: var(--muted); text-align: center; margin: 0 0 10px;
  }
  .limit-note.warn { color: var(--error); font-weight: 600; }
  .input-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-soft);
    border: 1px solid var(--hairline-strong);
    border-radius: 9999px;
    padding: 6px 6px 6px 18px;
  }
  .input-bar input {
    flex: 1; border: none; background: transparent; outline: none;
    font-size: 15px; color: var(--ink); font-family: inherit;
  }
  .input-bar input::placeholder { color: var(--muted-soft); }
  .send-btn {
    width: 40px; height: 40px; border-radius: 9999px; border: none;
    background: var(--primary); color: var(--on-primary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: transform .12s ease, background .12s ease;
  }
  .send-btn:active { transform: scale(0.92); background: var(--primary-active); }
  .send-btn:disabled { background: var(--muted-soft); cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; }

  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .stage { display: none; }
    .chat-header { display: flex; }
  }
</style>
</head>
<body>

<div id="loader" aria-hidden="true">
  <svg viewBox="0 0 60 60" width="52" height="52"><circle cx="30" cy="30" r="22"/></svg>
</div>

<div class="app">
  <!-- Left: character stage (desktop) -->
  <aside class="stage">
    <div class="stage-header">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div class="brand-text">
          <h1>Tiny</h1>
          <p>The 21st Century AI</p>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <div class="character-wrap">
      <img id="imgSide" src="/images/side.png" alt="Tiny, thinking" class="active">
      <img id="imgFront" src="/images/front.png" alt="Tiny, answering">
    </div>
    <div class="stage-caption">
      <p class="status" id="statusLine">Ready when you are</p>
      <p class="bio">Wondermayank's AI persona — ask about his tools, ThunderStudy, or anything else.</p>
    </div>
  </aside>

  <!-- Right: chat -->
  <section class="chat-col">
    <div class="chat-header">
      <div class="brand-mark" style="width:30px;height:30px;font-size:14px;">T</div>
      <div>
        <div style="font-weight:700;font-size:15px;">Tiny</div>
        <div style="font-size:11px;color:var(--muted);">The 21st Century AI</div>
      </div>
      <button class="theme-toggle" id="themeToggleMobile" style="margin-left:auto;width:34px;height:34px;" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <p class="limit-note" id="limitNote">10 free messages a day</p>
      <div class="input-bar">
        <input id="input" type="text" placeholder="Ask Tiny anything…" maxlength="500" autocomplete="off">
        <button class="send-btn" id="sendBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        </button>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  // ---- Theme ----
  const root = document.documentElement;
  const saved = localStorage.getItem('tiny_theme') || 'light';
  root.setAttribute('data-theme', saved);
  function toggleTheme() {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('tiny_theme', next);
  }
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  document.getElementById('themeToggleMobile').addEventListener('click', toggleTheme);

  // ---- Loader ----
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => document.getElementById('loader').classList.add('hide'), 300);
  });
  setTimeout(() => document.getElementById('loader').classList.add('hide'), 1500);

  // ---- Character state ----
  const imgSide = document.getElementById('imgSide');
  const imgFront = document.getElementById('imgFront');
  const statusLine = document.getElementById('statusLine');
  function showThinking() {
    imgSide.classList.add('active');
    imgFront.classList.remove('active');
    statusLine.textContent = 'Thinking…';
  }
  function showAnswered() {
    imgFront.classList.add('active');
    imgSide.classList.remove('active');
    statusLine.textContent = 'Here you go';
  }

  // ---- Rate limit: 10 messages/day, stored client-side ----
  const LIMIT = 10;
  function getUsage() {
    const today = new Date().toISOString().slice(0, 10);
    let data = JSON.parse(localStorage.getItem('tiny_usage') || 'null');
    if (!data || data.date !== today) {
      data = { date: today, count: 0 };
      localStorage.setItem('tiny_usage', JSON.stringify(data));
    }
    return data;
  }
  function incUsage() {
    const data = getUsage();
    data.count += 1;
    localStorage.setItem('tiny_usage', JSON.stringify(data));
    return data.count;
  }
  function refreshLimitNote() {
    const used = getUsage().count;
    const left = Math.max(0, LIMIT - used);
    const note = document.getElementById('limitNote');
    if (left === 0) {
      note.textContent = "You've used today's 10 free messages — come back tomorrow.";
      note.classList.add('warn');
      input.disabled = true;
      sendBtn.disabled = true;
    } else {
      note.textContent = left + ' of ' + LIMIT + ' free messages left today';
      note.classList.remove('warn');
    }
  }

  // ---- Chat ----
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  let history = [];

  function addBubble(role, text) {
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    if (getUsage().count >= LIMIT) { refreshLimitNote(); return; }

    addBubble('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    sendBtn.disabled = true;
    showThinking();
    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        addBubble('bot', "Something went wrong on my end: " + (data.error || 'unknown error') + ". Try again in a moment.");
      } else {
        addBubble('bot', data.reply);
        history.push({ role: 'assistant', content: data.reply });
        incUsage();
        showAnswered();
      }
    } catch (err) {
      removeTyping();
      addBubble('bot', "I couldn't reach the server. Check your connection and try again.");
    } finally {
      sendBtn.disabled = false;
      refreshLimitNote();
      input.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

  // ---- Init ----
  refreshLimitNote();
  addBubble('bot', "Hey, I'm Tiny — Wondermayank's AI. Ask me about his tools, ThunderStudy, or anything else on your mind.");
})();
</script>
</body>
</html>
